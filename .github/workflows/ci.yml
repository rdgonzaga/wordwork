name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test (TZ=UTC)
        run: npm test
        env:
          TZ: UTC
      - name: Test (TZ=America/New_York)
        run: npm test
        env:
          TZ: America/New_York
      - run: npm run build
